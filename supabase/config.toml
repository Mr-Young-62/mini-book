# Supabase configuration for MeelieFont Mini Digital Library
project_id = "meeliefont-library"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54323

[studio]
enabled = true
port = 54324

[auth]
enabled = true
port = 54325
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
minimum_password_length = 8
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[functions]
  send-update-push = { verify_jwt = false }
  book-metadata = { verify_jwt = true }

[storage]
enabled = true
port = 54326
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
port = 54327
policy = "per_worker"
inspector_port = 8083
