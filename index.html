    <script>
      // Guard window.fetch to ensure it is writable and configurable, preventing
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when browser extension request interceptors run in sandboxed iframes.
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return activeFetch; },
            set: function(val) { activeFetch = val; }
          });
        } catch (_) {}
      })();
    </script>
