name: Desktop Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      gcs: ${{ steps.flags.outputs.gcs }}
      signing: ${{ steps.flags.outputs.signing }}
    steps:
      - id: flags
        env:
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "gcs=$([ -n "$APK_STORAGE_BUCKET" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "signing=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop build
        if: needs.preflight.outputs.signing == 'true'
        env:
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          GCS: ${{ needs.preflight.outputs.gcs }}
        shell: bash
        run: |
          if [ "$GCS" = "true" ]; then
            ENDPOINT="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/desktop/latest.json"
          else
            ENDPOINT="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/desktop-latest.json"
          fi
          node scripts/prepare-desktop-build.mjs --tag "$GITHUB_REF_NAME" --endpoint "$ENDPOINT"

      - name: Prepare desktop build without updater
        if: needs.preflight.outputs.signing != 'true'
        run: node scripts/prepare-desktop-build.mjs --tag "$GITHUB_REF_NAME" --updater false

      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export VITE_APP_VERSION="${GITHUB_REF_NAME#v}"
          export VITE_APP_VERSION_CODE="$(node scripts/version-utils.mjs "$GITHUB_REF_NAME")"
          echo "Desktop bundle version: ${VITE_APP_VERSION} (versionCode ${VITE_APP_VERSION_CODE})"
          npx tauri build

      - name: Stage updater artifacts
        env:
          SIGNING: ${{ needs.preflight.outputs.signing }}
        shell: bash
        run: |
          mkdir -p upload
          find src-tauri/target -type f -path '*/bundle/*' -exec cp {} upload/ \;
          ls -la upload/
          artifacts="$(find upload -type f \( -name '*.nsis.zip' -o -name '*.app.tar.gz' \) | wc -l)"
          test "$artifacts" -ge 1 || (echo "No updater artifact staged" && exit 1)
          if [ "$SIGNING" = "true" ]; then
            sigs="$(find upload -type f -name '*.sig' | wc -l)"
            test "$sigs" -ge "$artifacts" || (echo "Missing updater signatures ($artifacts artifacts vs $sigs sigs)" && exit 1)
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: upload/
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Authenticate to Google Cloud
        if: needs.preflight.outputs.gcs == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: needs.preflight.outputs.gcs == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Upload desktop artifacts and publish updater manifest
        env:
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          GCS: ${{ needs.preflight.outputs.gcs }}
          SIGNING: ${{ needs.preflight.outputs.signing }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GCS" = "true" ]; then
            BASE_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/desktop"
          else
            BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          fi
          if [ "$GCS" = "true" ]; then
            while IFS= read -r file; do
              name="$(basename "$file")"
              gcloud storage cp --cache-control="public,max-age=31536000,immutable" \
                "$file" "gs://${APK_STORAGE_BUCKET}/desktop/${name}"
              local_size="$(stat -c%s "$file")"
              remote_size="$(curl -fsSI --max-time 30 "${BASE_URL}/${name}" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}' | tail -n1)"
              test -n "$remote_size" || (echo "Upload verification failed: no content-length for ${name}" && exit 1)
              test "$remote_size" = "$local_size" || (echo "Upload verification failed for ${name}: remote=${remote_size} local=${local_size}" && exit 1)
              echo "Verified ${name} (${local_size} bytes)"
            done < <(find artifacts -type f | sort)
          else
            echo "GCS bucket not configured; desktop artifacts will be attached to the GitHub Release only."
          fi
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.nsis.zip' -o -name '*.sig' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -gt 0 || (echo "No desktop release assets staged" && exit 1)
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          )
          CHANGES_FILE="$(mktemp)"
          git log --no-merges --pretty='- %s' -n 30 > "$CHANGES_FILE" || true
          if [ "$SIGNING" = "true" ]; then
            node scripts/generate-desktop-manifest.mjs \
              --version "$VERSION" \
              --in artifacts \
              --base-url "$BASE_URL" \
              --notes-file "$CHANGES_FILE" \
              --out desktop-latest.json
            cat desktop-latest.json
            cp desktop-latest.json release-assets/desktop-latest.json
            if [ "$GCS" = "true" ]; then
              gcloud storage cp --cache-control="public,max-age=60,must-revalidate" \
                desktop-latest.json \
                "gs://${APK_STORAGE_BUCKET}/desktop/latest.json"
              echo "Published ${BASE_URL}/latest.json"
            fi
          else
            echo "Tauri signing key not configured; desktop updater manifest will not be published."
          fi

      - name: Publish desktop assets to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MeelieFont ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
