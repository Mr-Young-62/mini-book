name: Deploy Web to Vercel

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID secret" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID secret" && exit 1)

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build web app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_URL: ${{ secrets.VITE_AUTH_REDIRECT_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_UPDATE_MANIFEST_URL: ${{ secrets.VITE_UPDATE_MANIFEST_URL }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VITE_APP_VERSION="${GITHUB_REF_NAME#v}"
            export VITE_APP_VERSION_CODE="$(node scripts/version-utils.mjs "$GITHUB_REF_NAME")"
          else
            export VITE_APP_VERSION="main"
            export VITE_APP_VERSION_CODE="0"
          fi
          if [ -n "$APK_STORAGE_BUCKET" ]; then
            export VITE_UPDATE_MANIFEST_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/latest.json"
          elif [ -z "$VITE_UPDATE_MANIFEST_URL" ]; then
            echo "Missing APK_STORAGE_BUCKET and VITE_UPDATE_MANIFEST_URL" && exit 1
          fi
          npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL="$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployed to $DEPLOY_URL"
