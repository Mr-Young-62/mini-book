name: Android Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      gcs: ${{ steps.flags.outputs.gcs }}
      fcm: ${{ steps.flags.outputs.fcm }}
      webpush: ${{ steps.flags.outputs.webpush }}
      vercel: ${{ steps.flags.outputs.vercel }}
      signing: ${{ steps.flags.outputs.signing }}
    steps:
      - id: flags
        env:
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          UPDATE_PUSH_SECRET: ${{ secrets.UPDATE_PUSH_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "gcs=$([ -n "$APK_STORAGE_BUCKET" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fcm=$([ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "webpush=$([ -n "$SUPABASE_FUNCTIONS_URL" ] && [ -n "$UPDATE_PUSH_SECRET" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "vercel=$([ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android release signing requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "signing=true" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          GCS: ${{ needs.preflight.outputs.gcs }}
        run: |
          export VITE_APP_VERSION="${RELEASE_TAG#v}"
          export VITE_APP_VERSION_CODE="$(node scripts/version-utils.mjs "$RELEASE_TAG")"
          if [ "$GCS" = "true" ]; then
            export VITE_UPDATE_MANIFEST_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/latest.json"
          else
            export VITE_UPDATE_MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json"
          fi
          echo "Web bundle version: ${VITE_APP_VERSION} (versionCode ${VITE_APP_VERSION_CODE})"
          npm run build

      - name: Prepare Android files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING: ${{ needs.preflight.outputs.signing }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "Google services JSON not configured; FCM will be unavailable."
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/meeliefont-release.jks
          test -s android/app/meeliefont-release.jks || (echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a non-empty keystore file." && exit 1)
          npx cap sync android

      - name: Authenticate to Google Cloud
        if: needs.preflight.outputs.gcs == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: needs.preflight.outputs.gcs == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          GCS: ${{ needs.preflight.outputs.gcs }}
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          export APP_VERSION_CODE="$(node scripts/version-utils.mjs "$GITHUB_REF_NAME")"
          if [ -f android/app/meeliefont-release.jks ]; then
            export ANDROID_KEYSTORE_PATH=meeliefont-release.jks
          fi
          cd android
          ./gradlew app:assembleRelease
          cd ..
          APK_NAME="MeelieFont-${GITHUB_REF_NAME}.apk"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH" || (echo "Signed APK not found in android/app/build/outputs/apk/release" && exit 1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose --print-certs "$APK_PATH"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/aapt" dump badging "$APK_PATH" | grep -F "package: name='org.readowl.library'"
          echo "Using signed APK: $APK_PATH"
          if [ "$GCS" = "true" ]; then
            gcloud storage cp --cache-control="public,max-age=31536000,immutable" \
              "$APK_PATH" \
              "gs://${APK_STORAGE_BUCKET}/${APK_NAME}"
            PUBLIC_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/${APK_NAME}"
            LOCAL_SIZE="$(stat -c%s "$APK_PATH")"
            CONTENT_LENGTH="$(curl -fsSI --max-time 30 "$PUBLIC_URL" | tr -d '\r' | awk 'tolower($1)=="content-length:" {print $2}' | tail -n1)"
            test -n "$CONTENT_LENGTH" || (echo "Upload verification failed: no content-length from $PUBLIC_URL" && exit 1)
            test "$CONTENT_LENGTH" = "$LOCAL_SIZE" || (echo "Upload verification failed: remote=$CONTENT_LENGTH local=$LOCAL_SIZE" && exit 1)
            echo "Verified uploaded APK: $PUBLIC_URL ($LOCAL_SIZE bytes)"
          else
            echo "GCS bucket not configured; APK will be attached to the GitHub Release only."
          fi
          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/${APK_NAME}"
          sha256sum "release-assets/${APK_NAME}" > "release-assets/${APK_NAME}.sha256"

      - name: Publish update manifest
        env:
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_SIGNING_PRIVATE_KEY }}
          GCS: ${{ needs.preflight.outputs.gcs }}
        run: |
          APK_NAME="MeelieFont-${RELEASE_TAG}.apk"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH" || (echo "Signed APK not found while generating the update manifest" && exit 1)
          if [ "$GCS" = "true" ]; then
            PUBLIC_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/${APK_NAME}"
            LATEST_URL="https://storage.googleapis.com/${APK_STORAGE_BUCKET}/latest.json"
            PREVIOUS_URL="$LATEST_URL"
          else
            PUBLIC_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
            LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/latest.json"
            PREVIOUS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          fi
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_SIZE="$(stat -c%s "$APK_PATH")"
          PUBLISHED_ARGS=()
          PREVIOUS_MANIFEST="$(mktemp)"
          if curl -fsS --max-time 15 "$PREVIOUS_URL" -o "$PREVIOUS_MANIFEST"; then
            PUBLISHED_ARGS=(--published "$PREVIOUS_MANIFEST")
            echo "Comparing versionCode against published manifest: $PREVIOUS_URL"
          else
            rm -f "$PREVIOUS_MANIFEST"
            echo "No published latest.json yet, bootstrapping."
          fi
          CHANGELOG_FILE="$(mktemp)"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --no-merges --pretty='- %s' "${PREV_TAG}..HEAD" > "$CHANGELOG_FILE" || true
            echo "Changelog range: ${PREV_TAG}..HEAD"
          else
            git log --no-merges --pretty='- %s' -n 50 > "$CHANGELOG_FILE" || true
            echo "First release: changelog seeded from the last 50 commits."
          fi
          node scripts/generate-latest-manifest.mjs \
            --tag "$RELEASE_TAG" \
            --sha256 "$APK_SHA256" \
            --size "$APK_SIZE" \
            --url "$PUBLIC_URL" \
            --changelog-file "$CHANGELOG_FILE" \
            --out latest.json \
            ${PUBLISHED_ARGS[@]+"${PUBLISHED_ARGS[@]}"}
          if [ -n "$UPDATER_SIGNING_PRIVATE_KEY" ]; then
            SIGNING_KEY_FILE="$(mktemp)"
            printf '%s' "$UPDATER_SIGNING_PRIVATE_KEY" > "$SIGNING_KEY_FILE"
            node scripts/sign-manifest.mjs --in latest.json --key "$SIGNING_KEY_FILE" --out latest-signed.json
            mv latest-signed.json latest.json
            rm -f "$SIGNING_KEY_FILE"
          else
            echo "Updater signing key not configured; publishing an unsigned manifest."
          fi
          echo "Manifest to publish:"
          cat latest.json
          cp latest.json release-assets/latest.json
          if [ "$GCS" = "true" ]; then
            gcloud storage cp --cache-control="public,max-age=60,must-revalidate" \
              latest.json \
              "gs://${APK_STORAGE_BUCKET}/latest.json"
            echo "Published $LATEST_URL"
          fi

      - name: Publish APK release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: MeelieFont ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Remove signing material
        if: always()
        run: rm -f android/app/meeliefont-release.jks android/app/google-services.json

  deploy-web:
    needs: [preflight, build-and-release]
    if: needs.preflight.outputs.vercel == 'true'
    uses: ./.github/workflows/vercel-release.yml
    secrets: inherit

  notify-devices:
    needs: [preflight, build-and-release, deploy-web]
    if: always() && needs.build-and-release.result == 'success' && (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped') && (needs.preflight.outputs.fcm == 'true' || needs.preflight.outputs.webpush == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Firebase
        if: needs.preflight.outputs.fcm == 'true'
        id: firebase-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send update notification to subscribed Android devices
        if: needs.preflight.outputs.fcm == 'true'
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.auth_token }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APK_STORAGE_BUCKET: ${{ secrets.APK_STORAGE_BUCKET }}
          RELEASE_TAG: ${{ github.ref_name }}
          GCS: ${{ needs.preflight.outputs.gcs }}
        run: |
          node --input-type=module <<'NODE'
          const projectId = process.env.FIREBASE_PROJECT_ID;
          const bucket = process.env.APK_STORAGE_BUCKET;
          const gcs = process.env.GCS === 'true';
          if (!projectId || !process.env.FIREBASE_ACCESS_TOKEN) {
            throw new Error('Firebase project ID or access token is missing.');
          }
          if (gcs && !bucket) {
            throw new Error('APK_STORAGE_BUCKET is required when GCS upload is enabled.');
          }
          const tag = process.env.RELEASE_TAG;
          const apkUrl = gcs
            ? `https://storage.googleapis.com/${bucket}/MeelieFont-${tag}.apk`
            : `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/MeelieFont-${tag}.apk`;
          const response = await fetch(`https://fcm.googleapis.com/v1/projects/${projectId}/messages:send`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.FIREBASE_ACCESS_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: {
                topic: 'meeliefont-updates',
                notification: {
                  title: 'MeelieFont',
                  body: `Versi ${tag} tersedia. Ketuk untuk mengunduh pembaruan.`,
                },
                data: {
                  version: tag,
                  apkUrl,
                },
              },
            }),
          });
          if (!response.ok) {
            throw new Error(`Firebase rejected the update notification: ${response.status} ${await response.text()}`);
          }
          NODE

      - name: Send update notification to web/iOS subscribers
        if: needs.preflight.outputs.webpush == 'true'
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          UPDATE_PUSH_SECRET: ${{ secrets.UPDATE_PUSH_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          response="$(curl -fsS -X POST "${SUPABASE_FUNCTIONS_URL%/}/send-update-push" \
            -H "Authorization: Bearer ${UPDATE_PUSH_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${RELEASE_TAG#v}\",\"url\":\"/\"}")" \
            || (echo "send-update-push request failed" && exit 1)
          echo "Web push result: $response"
